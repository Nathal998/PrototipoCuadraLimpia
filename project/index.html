<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuadra Limpia — Prototipo digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Figtree', system-ui, sans-serif; background: #ebe6da; color: #16241c; overflow: hidden; }
  .cl-display { font-family: 'Bricolage Grotesque', 'Figtree', sans-serif; font-weight: 800; letter-spacing: -0.02em; }
  .cl-press { transition: transform .12s ease, filter .12s; }
  .cl-press:active { transform: scale(.97); filter: brightness(.96); }
  .cl-fade { animation: clFade .35s ease; }
  .cl-pop { animation: clPop .45s cubic-bezier(.2,1.4,.4,1); }
  .cl-screen { animation: clSlide .28s ease; }
  @keyframes clFade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes clPop { from { transform: scale(.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  @keyframes clSlide { from { opacity: 0; transform: translateX(14px) } to { opacity: 1; transform: none } }
  ::-webkit-scrollbar { width: 0; height: 0; }
  .side::-webkit-scrollbar { width: 6px; } .side::-webkit-scrollbar-thumb { background: #cfc8b6; border-radius: 3px; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios_frame.jsx"></script>
<script type="text/babel" src="app-ui.jsx"></script>
<script type="text/babel" src="screens-a.jsx"></script>
<script type="text/babel" src="screens-b.jsx"></script>
<script type="text/babel" src="presentacion.jsx"></script>
</body>
</html>
